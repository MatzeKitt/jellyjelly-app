name: JellyJelly
options:
  bundleIdPrefix: media.kitt
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  xcodeVersion: "27.1"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: QR2CW5GWB2
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0
targets:
  JellyJelly:
    type: application
    platform: macOS
    sources:
      - path: JellyJelly
        excludes:
          - "Vendor/mpv/*.h"
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: media.kitt.JellyJelly
        PRODUCT_NAME: JellyJelly
        INFOPLIST_FILE: JellyJelly/Resources/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: JellyJelly/Player/MPV/JellyJelly-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/JellyJelly/Vendor"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: JellyJelly/Resources/JellyJelly.entitlements
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) GL_SILENCE_DEPRECATION=1"
        OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -DGL_SILENCE_DEPRECATION"
